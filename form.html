<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cognitive Wellness & Medical Guidance</title>

    <link rel="stylesheet" href="form.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <button id="themeToggle" class="theme-toggle">
  <i class="fa-solid fa-moon"></i>
</button>
  <div class="login-container">
   <h1>Welcome Back</h1>
<p class="subtitle">Login to continue your healthcare journey</p>
    
    <form action="/login" method="post">
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <div style="position: relative;">
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
          <span id="togglePassword" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer;">
            <i class="fa-solid fa-eye"></i>
          </span>
        </div>
      </div>
      <div class="btn-container">
        <button type="button" class="btn btn-login" onclick="handlelogin()">Login</button>
        <button type="button" class="btn btn-register" onclick="redirectToRegister()">Create Account</button>
      </div>
    </form>
  </div>

  <script>
    function redirectToRegister() {
      window.location.href = "register.html";
    }

    async function handlelogin() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
  
      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, password }),
        });
  
        const data = await response.json();
  
        if (data.success) {
          alert("Login successful!");
          window.location.href = data.redirect || "/healthcare7/index.html";
        } else {
          alert(data.message || "Login failed. Please try again.");
        }
      } catch (err) {
        console.error('Error during login:', err);
        alert("An error occurred while logging in. Please try again later.");
      }
    }

    // Toggle password visibility
    const togglePassword = document.getElementById('togglePassword');
    const passwordField = document.getElementById('password');

    togglePassword.addEventListener('click', () => {
      const type = passwordField.type === 'password' ? 'text' : 'password';
      passwordField.type = type;

      // Change the eye symbol based on visibility
      togglePassword.textContent = type === 'password' ? '👁️' : '🙈';
    });
    const themeToggle = document.getElementById("themeToggle");

themeToggle.addEventListener("click", () => {

  document.body.classList.toggle("light-mode");

  if(document.body.classList.contains("light-mode")){
      localStorage.setItem("theme","light");
      themeToggle.innerHTML = '<i class="fa-solid fa-sun"></i>';
  }else{
      localStorage.setItem("theme","dark");
      themeToggle.innerHTML = '<i class="fa-solid fa-moon"></i>';
  }
});

window.addEventListener("load",()=>{

   const savedTheme = localStorage.getItem("theme");

   if(savedTheme === "light"){
      document.body.classList.add("light-mode");
      themeToggle.innerHTML = '<i class="fa-solid fa-sun"></i>';
   }
});
  </script>
</body>

</html>
