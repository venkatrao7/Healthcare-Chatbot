<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ThyroNet - Register</title>

  <link rel="stylesheet" href="register.css">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body>
  <button id="themeToggle" class="theme-toggle">
   <i class="fa-solid fa-moon"></i>
</button>
  <div class="register-container">
    <h1>Create Account</h1>
<p class="subtitle">Join ThyroNet and begin your healthcare journey</p>
    <form action="/register" method="POST" onsubmit="return validateForm()">
      <div class="form-group">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
      </div>
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <div style="position: relative;">
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
          <span id="togglePassword" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer;">
            <i class="fa-solid fa-eye"></i>
          </span>
        </div>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password:</label>
        <div style="position: relative;">
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
          <span id="toggleConfirmPassword" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer;">
            <i class="fa-solid fa-eye"></i>
          </span>
        </div>
      </div>
      <button type="submit" class="btn-register">Register</button>
    </form>
    <a href="form.html" class="login-link">Already have an account? Login here</a>
  </div>

  <script>
    function validateForm() {
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        alert('Passwords do not match!');
        return false;
      }
      return true;
    }

    // Toggle visibility for password
    const togglePassword = document.getElementById('togglePassword');
    const passwordField = document.getElementById('password');

    togglePassword.addEventListener('click', () => {
      const type = passwordField.type === 'password' ? 'text' : 'password';
      passwordField.type = type;

      // Change the eye symbol
      togglePassword.textContent = type === 'password' ? '👁' : '🙈';
    });

    // Toggle visibility for confirm password
    const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
    const confirmPasswordField = document.getElementById('confirmPassword');

    toggleConfirmPassword.addEventListener('click', () => {
      const type = confirmPasswordField.type === 'password' ? 'text' : 'password';
      confirmPasswordField.type = type;

      // Change the eye symbol
      toggleConfirmPassword.textContent = type === 'password' ? '👁' : '🙈';
    });
    const themeToggle = document.getElementById("themeToggle");

themeToggle.addEventListener("click", () => {

   document.body.classList.toggle("light-mode");

   if(document.body.classList.contains("light-mode")){

      localStorage.setItem("theme","light");

      themeToggle.innerHTML =
      '<i class="fa-solid fa-sun"></i>';

   }else{

      localStorage.setItem("theme","dark");

      themeToggle.innerHTML =
      '<i class="fa-solid fa-moon"></i>';
   }
});

window.addEventListener("load",()=>{

   const savedTheme = localStorage.getItem("theme");

   if(savedTheme === "light"){

      document.body.classList.add("light-mode");

      themeToggle.innerHTML =
      '<i class="fa-solid fa-sun"></i>';
   }
});
  </script>
</body>
</html>
